# On a version tag (v1.2.3): build the release and attach it to the GitHub release.
# Uploading to the public S3 bucket for the one-click link is done with scripts/publish.sh,
# or add an OIDC role here (aws-actions/configure-aws-credentials) to automate it.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build release
        run: npm run release -- --base-url "${{ vars.ARTIFACT_BASE_URL }}/${GITHUB_REF_NAME}"
      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
